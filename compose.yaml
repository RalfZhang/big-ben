services:
  big-ben:
    build: .
    container_name: big-ben
    restart: unless-stopped
    environment:
      # All three are one-off: set them on the command line, e.g.
      #   LOG_LEVEL=debug docker compose up -d
      # The next plain `docker compose up -d` resets them.
      # debug < info < warn < error. debug logs every request
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Post a startup notice to these platforms (comma-separated names, or all)
      - POST_ON_STARTUP=${POST_ON_STARTUP:-}
      # Log comment replies instead of sending them
      - REPLY_DRY_RUN=${REPLY_DRY_RUN:-}
    volumes:
      # Not in the image. After editing it, run docker compose restart
      - ./config.js:/app/config.js:ro
      # Threads tokens and reply state. Must be writable, or refreshed tokens are lost
      - ./data:/app/data
    # Docker logs have no size limit by default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
